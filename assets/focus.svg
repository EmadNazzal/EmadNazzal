<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-label="What I bring: product engineering, applied AI, architecture, AWS">
<style>
  .sans{font-family:'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Inter,Arial,sans-serif} .mono{font-family:ui-monospace,'SF Mono','Cascadia Code',Consolas,'Liberation Mono',monospace}
  .rise{opacity:0;transform:translateY(10px);animation:rise .9s cubic-bezier(0.23,1,0.32,1) forwards}
  @keyframes rise{to{opacity:1;transform:none}}
  .pulse{animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}
</style>
<defs>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="rgba(211,218,230,0.12)" stroke-width="1"/></pattern>
  <radialGradient id="glow" cx="80%" cy="20%" r="70%"><stop offset="0" stop-color="#c6ff34" stop-opacity=".10"/><stop offset="1" stop-color="#c6ff34" stop-opacity="0"/></radialGradient>
  <linearGradient id="fade" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#07080b" stop-opacity="0"/><stop offset="1" stop-color="#07080b" stop-opacity=".9"/></linearGradient>
  <clipPath id="round"><rect width="880" height="300" rx="22"/></clipPath>
</defs>
<g clip-path="url(#round)">
  <rect width="880" height="300" fill="#07080b"/>
  <rect width="880" height="300" fill="url(#grid)" opacity=".55"/>
  <rect width="880" height="300" fill="url(#glow)"/>
  <g class="rise" style="animation-delay:0.1s">
      <rect x="30" y="22" width="400" height="118" rx="16" fill="#0c0e13" stroke="rgba(211,218,230,0.22)"/>
      <rect x="48" y="42" width="30" height="30" rx="9" fill="none" stroke="rgba(211,218,230,0.22)"/>
      <text class="mono" x="63" y="62" text-anchor="middle" font-size="13" fill="#d3dae6">A</text>
      <text class="sans" x="94" y="63" font-size="17" font-weight="600" fill="#d3dae6">Product engineering</text>
      <text class="sans" x="94" y="88" font-size="13.5" fill="rgba(211,218,230,0.62)">Features from first ticket to production: APIs,</text><text class="sans" x="94" y="107" font-size="13.5" fill="rgba(211,218,230,0.62)">data models, interfaces, tests and deploys.</text>
    </g><g class="rise" style="animation-delay:0.22s">
      <rect x="450" y="22" width="400" height="118" rx="16" fill="#0c0e13" stroke="rgba(211,218,230,0.22)"/>
      <rect x="468" y="42" width="30" height="30" rx="9" fill="none" stroke="#c6ff34"/>
      <text class="mono" x="483" y="62" text-anchor="middle" font-size="13" fill="#c6ff34">B</text>
      <text class="sans" x="514" y="63" font-size="17" font-weight="600" fill="#d3dae6">Applied AI</text>
      <text class="sans" x="514" y="88" font-size="13.5" fill="rgba(211,218,230,0.62)">RAG grounded in real data, and agents on ADK that</text><text class="sans" x="514" y="107" font-size="13.5" fill="rgba(211,218,230,0.62)">plan and call tools. The model is one component; I</text><text class="sans" x="514" y="126" font-size="13.5" fill="rgba(211,218,230,0.62)">engineer the rest.</text>
    </g><g class="rise" style="animation-delay:0.33999999999999997s">
      <rect x="30" y="160" width="400" height="118" rx="16" fill="#0c0e13" stroke="rgba(211,218,230,0.22)"/>
      <rect x="48" y="180" width="30" height="30" rx="9" fill="none" stroke="rgba(211,218,230,0.22)"/>
      <text class="mono" x="63" y="200" text-anchor="middle" font-size="13" fill="#d3dae6">C</text>
      <text class="sans" x="94" y="201" font-size="17" font-weight="600" fill="#d3dae6">Architecture</text>
      <text class="sans" x="94" y="226" font-size="13.5" fill="rgba(211,218,230,0.62)">My favourite part. Boundaries, data flow, failure</text><text class="sans" x="94" y="245" font-size="13.5" fill="rgba(211,218,230,0.62)">modes: the decisions that are expensive to change</text><text class="sans" x="94" y="264" font-size="13.5" fill="rgba(211,218,230,0.62)">later.</text>
    </g><g class="rise" style="animation-delay:0.45999999999999996s">
      <rect x="450" y="160" width="400" height="118" rx="16" fill="#0c0e13" stroke="rgba(211,218,230,0.22)"/>
      <rect x="468" y="180" width="30" height="30" rx="9" fill="none" stroke="rgba(211,218,230,0.22)"/>
      <text class="mono" x="483" y="200" text-anchor="middle" font-size="13" fill="#d3dae6">D</text>
      <text class="sans" x="514" y="201" font-size="17" font-weight="600" fill="#d3dae6">AWS &amp; cloud</text>
      <text class="sans" x="514" y="226" font-size="13.5" fill="rgba(211,218,230,0.62)">Infrastructure sized for the workload, deployed so</text><text class="sans" x="514" y="245" font-size="13.5" fill="rgba(211,218,230,0.62)">the team can ship without fear.</text>
    </g>
</g>
<rect x=".5" y=".5" width="879" height="299" rx="21.5" fill="none" stroke="rgba(211,218,230,0.22)"/>
</svg>
